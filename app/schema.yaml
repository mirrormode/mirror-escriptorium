components:
  schemas:
    AlignRequest:
      type: object
      properties:
        parts:
          type: array
          items:
            type: integer
        transcription:
          type: integer
          description: The transcription on which to perform alignment.
        witness_file:
          type: string
          format: binary
          description: The reference text for alignment; must be a .txt file.
        existing_witness:
          type: integer
          description: Reuse a previously-uploaded reference text.
        n_gram:
          type: integer
          maximum: 25
          minimum: 2
          description: Length (2–25) of token sequences to compare; 25 should work
            well for at least moderately clean OCR. For very poor OCR, lower to 3
            or 4.
        max_offset:
          type: integer
          maximum: 80
          minimum: 0
          description: Enables max-offset and disables beam search. Maximum number
            of characters (20–80) difference between the aligned witness text and
            the original transcription.
        beam_size:
          type: integer
          maximum: 100
          minimum: 0
          description: Enables beam search; if this and max offset are left unset,
            beam search will be on and beam size set to 20. Higher beam size (1-100)
            will result in slower computation but more accurate results.
        gap:
          type: integer
          maximum: 1000000
          minimum: 1
          description: The distance between matching unique n-grams; 600 should work
            well for clean OCR or texts where passages align to different portions
            of the witness text. To force end-to-end alignment of two documents, increase
            to 1,000,000.
        merge:
          type: boolean
          title: Merge aligned text with existing transcription
          description: If checked, the aligner will reuse the text of the original
            transcription when alignment could not be performed; if unchecked, those
            lines will be blank.
        full_doc:
          type: boolean
          title: Use full transcribed document
          description: If checked, the aligner will use all transcribed pages of the
            document to find matches. If unchecked, it will compare each page to the
            text separately.
        threshold:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          title: Line length match threshold
          description: Minimum proportion (0.0–1.0) of aligned line length to original
            transcription, below which matches are ignored. At 0.0, all matches are
            accepted.
        region_types:
          type: array
          items:
            $ref: '#/components/schemas/RegionTypesEnum'
          description: Region types to include in the alignment.
        layer_name:
          type: string
          minLength: 1
          description: Name for the new transcription layer produced by this alignment.
            If you reuse an existing layer name, the layer will be overwritten; use
            caution.
      required:
      - gap
      - layer_name
      - n_gram
      - region_types
      - threshold
      - transcription
    AnnotationComponent:
      type: object
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        name:
          type: string
          maxLength: 128
        allowed_values:
          type: array
          items:
            type: string
            maxLength: 128
          nullable: true
          description: Comma separated list of possible value, leave it empty for
            free input.
      required:
      - pk
    AnnotationComponentRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        allowed_values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          nullable: true
          description: Comma separated list of possible value, leave it empty for
            free input.
    AnnotationTaxonomy:
      type: object
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        name:
          type: string
          maxLength: 64
        abbreviation:
          type: string
          nullable: true
          maxLength: 3
        marker_type:
          $ref: '#/components/schemas/MarkerTypeEnum'
        marker_detail:
          type: string
          nullable: true
          maxLength: 7
        has_comments:
          type: boolean
        typology:
          $ref: '#/components/schemas/AnnotationType'
        components:
          type: array
          items:
            type: integer
      required:
      - marker_type
      - name
      - pk
    AnnotationTaxonomyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        abbreviation:
          type: string
          nullable: true
          maxLength: 3
        marker_type:
          $ref: '#/components/schemas/MarkerTypeEnum'
        marker_detail:
          type: string
          nullable: true
          maxLength: 7
        has_comments:
          type: boolean
        typology:
          $ref: '#/components/schemas/AnnotationTypeRequest'
        components:
          type: array
          items:
            type: integer
      required:
      - marker_type
      - name
    AnnotationType:
      type: object
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        name:
          type: string
          maxLength: 128
      required:
      - name
      - pk
    AnnotationTypeRequest:
