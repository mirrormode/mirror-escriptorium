openapi: 3.0.3
info:
  title: eScriptorium API
  version: 1.0.0
  description: "eScriptorium REST API\n    \n## API Versioning\nThe API is versioned
    using URL path versioning. The current version is v1, and the base URL for the
    API is /api/v1/. Future versions will be accessible under /api/v2/, etc.\n\n\n###
    Authentication\n\n- Django Session Login: [/api/v1/api-auth/login/](../api-auth/login/)\n-
    Token Auth: `POST /api/v1/token-auth/`\n\nAfter login, use the **Authorize** button.\n\nToken
    endpoint:\nPOST /api/v1/token-auth/\n\n### Licenses\n[MIT License](https://choosealicense.com/licenses/mit/)\n"
