        pk:
          type: integer
          readOnly: true
          title: ID
        document_part:
          type: integer
        external_id:
          type: string
          nullable: true
          maxLength: 128
        order:
          type: integer
          readOnly: true
        box: {}
        typology:
          type: integer
          nullable: true
      required:
